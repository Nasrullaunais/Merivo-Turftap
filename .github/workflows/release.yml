# Pushing a tag vX.Y.Z checks it, builds the images and releases them to the server.
# Running this workflow by hand from an existing tag puts that version back (docs/architecture/deployment.md).
name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/nasrullaunais/turftap

jobs:
  on-main:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: The tag points at a commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  check:
    needs: on-main
    uses: ./.github/workflows/check.yml

  images:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: web
            dockerfile: infra/web/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ github.ref_name }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: images
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && (needs.images.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      SERVER: deploy@${{ vars.DEPLOY_HOST }}
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - name: SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Copy this version's release files
        run: |
          scp compose.prod.yaml "$SERVER:/opt/turftap/compose.yaml"
          scp infra/deploy/release.sh "$SERVER:/opt/turftap/release.sh"
          scp infra/postgres/init.prod.sql "$SERVER:/opt/turftap/init.sql"
      - name: Release
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh "$SERVER" docker login ghcr.io -u "$GHCR_USER" --password-stdin
          ssh "$SERVER" /opt/turftap/release.sh "$VERSION"
      - name: Sign the server out of GHCR
        if: always()
        run: ssh "$SERVER" docker logout ghcr.io || true
