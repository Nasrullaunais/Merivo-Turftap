name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: turftap
          POSTGRES_PASSWORD: turftap
          POSTGRES_DB: turftap_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U turftap"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://turftap:turftap@localhost:5432/turftap_test
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Generated files are up to date
        run: |
          bun run gen
          (cd apps/portal && bunx vite build)
          (cd apps/console && bunx vite build)
          git diff --exit-code -- packages/contract apps/portal/src/routeTree.gen.ts apps/console/src/routeTree.gen.ts
